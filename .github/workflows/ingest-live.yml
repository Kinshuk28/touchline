# Runs every 5 minutes: 8,640 invocations/month. GitHub Actions gives
# UNLIMITED minutes only on PUBLIC repositories — on a private repo the
# 2,000 min/month free allowance would be exhausted in days by this job
# alone. This workflow assumes the repository stays public. If it is ever
# flipped private, either delete this schedule or it will silently burn
# the Actions minutes budget for every workflow in the repo.
name: ingest-live
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
# Shared with ingest-core and ingest-squads — see ingest-core.yml's
# concurrency comment for why: all three call football-data.org against a
# 10 req/min free-tier limit that is per API key, not per workflow, so they
# must not run in parallel. Do NOT split this back into its own group.
concurrency:
  group: football-data-api
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx tsx scripts/ingest/live.ts
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
