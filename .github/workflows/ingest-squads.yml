name: ingest-squads
on:
  schedule: [{ cron: '0 4 * * 1' }]
  workflow_dispatch:
# Shared with ingest-core and ingest-live — see ingest-core.yml's
# concurrency comment for why: all three call football-data.org against a
# 10 req/min free-tier limit that is per API key, not per workflow, so they
# must not run in parallel. Do NOT split this back into its own group.
concurrency:
  group: football-data-api
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx tsx scripts/ingest/squads.ts
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
