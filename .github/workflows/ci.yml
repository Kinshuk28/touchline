name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      # Diagnostic for Cause 2: `npm run build` fails in CI for an unknown
      # reason but succeeds locally with these exact two vars, so the code
      # is right and something about the *values* CI holds is wrong (a
      # dashboard URL instead of the API URL, a trailing newline from a
      # copy-paste, etc). This reports what CI actually received — never a
      # secret value, see scripts/preflight-env.ts — and fails fast with a
      # readable message instead of letting a bad value surface as an
      # opaque build error.
      - run: npx tsx scripts/preflight-env.ts site
        continue-on-error: false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          # From Task 6 onward, /scores executes server components that read
          # Postgres. The anon key is SELECT-only, enforced by grants and RLS,
          # and already ships to browsers by design, so it is safe here.
          # Never add SUPABASE_SERVICE_ROLE_KEY or FOOTBALL_DATA_KEY to CI.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          # Playwright's webServer (playwright.config.ts) runs `npm run
          # build && npm start` itself, so it needs the same two read
          # credentials the build step above does — and, after Critical 1
          # (lib/config/env.ts#loadSiteEnv), that is genuinely all it needs.
          # Never add SUPABASE_SERVICE_ROLE_KEY or FOOTBALL_DATA_KEY here.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
