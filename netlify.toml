[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.deploy-preview]
  command = "echo 'previews disabled to conserve free-tier credits'"

[[headers]]
  for = "/api/live"
  [headers.values]
    Cache-Control = "no-store"
